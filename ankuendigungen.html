<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankündigungen</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --primary: #bb2232;
            --text-color: #1a202c;
            --text-meta: #000000;
            --text-desc: #4a5568;
            --border-color: #e2e8f0;
            --card-radius: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui,
                         'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: transparent;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overflow-wrap: break-word;
        }

        #ankuendigungen-wrapper {
            container-type: inline-size;
        }

        #ankuendigungen-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            padding: 0;
        }

        /* ── Card ── */
        .ankuendigung-card {
            border: 1px solid var(--border-color);
            border-radius: var(--card-radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .ankuendigung-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.10);
        }

        .card-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #f0f0f0;
            border-radius: 0;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-body {
            padding: 16px 18px 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            position: relative;
        }

        .card-body::before {
            content: '';
            position: absolute;
            top: -16px;
            right: -16px;
            width: 64px;
            height: 64px;
            background: rgba(187, 34, 50, 0.06);
            border-radius: 0;
            pointer-events: none;
            z-index: 0;
        }

        .card-datum {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-meta);
            margin-bottom: 6px;
        }

        .card-titel {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.35;
            margin-bottom: 8px;
        }

        .card-beschreibung {
            font-size: 17px;
            color: var(--text-desc);
            line-height: 1.55;
            flex-grow: 1;
            margin-bottom: 14px;
        }

        .card-beschreibung p {
            margin: 0 0 0.6em;
        }

        .card-beschreibung p:last-child {
            margin-bottom: 0;
        }

        .card-beschreibung ul {
            margin: 0.4em 0;
            padding-left: 1.4em;
        }

        .card-beschreibung li {
            margin-bottom: 0.25em;
        }

        .card-link {
            font-size: 15px;
            font-weight: 600;
            color: #bb2232;
            text-decoration: none;
            display: inline-block;
            border: 1.5px solid #bb2232;
            border-radius: 0;
            padding: 6px 16px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .card-link:hover {
            background: #bb2232;
            color: #fff;
            text-decoration: none;
        }

        /* ── Status ── */
        #ankuendigungen-status {
            padding: 24px 0;
            color: var(--text-meta);
            font-size: 15px;
        }

        /* ── Tablet ── */
        @container (max-width: 900px) {
            #ankuendigungen-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 18px;
            }
        }

        /* ── Mobile ── */
        @container (max-width: 600px) {
            #ankuendigungen-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .card-body {
                padding: 12px 14px 14px;
            }

            .card-titel { font-size: 18px; }

            .card-beschreibung {
                font-size: 16px;
                margin-bottom: 10px;
            }
        }

        /* Touch: Link-Hover deaktivieren */
        @media (hover: none) and (pointer: coarse) {
            .card-link:hover {
                background: transparent;
                color: #bb2232;
            }
        }
    </style>
</head>
<body>
<div id="ankuendigungen-wrapper">
    <div id="ankuendigungen-grid"></div>
    <div id="ankuendigungen-status"></div>
</div>

<script>
(function () {
    'use strict';

    const grid   = document.getElementById('ankuendigungen-grid');
    const status = document.getElementById('ankuendigungen-status');
    const PLACEHOLDER = 'assets/images/placeholder.jpg';

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function renderMarkdown(str) {
        if (!str) return '';
        // Escape HTML first for safety, then apply formatting
        let s = escapeHtml(str);

        // Split into blocks by double newline (paragraphs)
        const blocks = s.split(/\n{2,}/);
        const rendered = blocks.map(block => {
            const lines = block.split('\n');

            // Check if all non-empty lines are bullet points
            const bulletLines = lines.filter(l => l.trim() !== '');
            const isList = bulletLines.length > 0 && bulletLines.every(l => /^[•\-]/.test(l.trim()));

            if (isList) {
                const items = lines
                    .filter(l => l.trim() !== '')
                    .map(l => `<li>${applyInline(l.replace(/^[•\-]\s*/, ''))}</li>`)
                    .join('');
                return `<ul>${items}</ul>`;
            }

            // Regular paragraph — single newlines become <br>
            const content = lines.map(l => applyInline(l)).join('<br>');
            return `<p>${content}</p>`;
        });

        return rendered.join('');
    }

    function applyInline(s) {
        return s
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>');
    }

    async function loadAnnouncements() {
        status.textContent = 'Lade Ankündigungen …';

        try {
            const res = await fetch('data/ankuendigungen.json', { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const items = await res.json();
            render(items);
        } catch (err) {
            console.error('Fehler beim Laden der Ankündigungen:', err);
            status.textContent = 'Ankündigungen konnten nicht geladen werden.';
        }
    }

    function render(items) {
        status.textContent = '';

        if (!items.length) {
            status.textContent = 'Keine Ankündigungen vorhanden.';
            return;
        }

        items.forEach(item => {
            const bild  = escapeHtml(item.bild || PLACEHOLDER);
            const titel = escapeHtml(item.titel || '');
            const datum = escapeHtml(item.datum || '');
            const desc  = renderMarkdown(item.beschreibung || '');
            const link      = escapeHtml(item.link || '');
            const linkText  = escapeHtml(item.linkText || 'Mehr erfahren');

            const card = document.createElement('div');
            card.className = 'ankuendigung-card';
            card.innerHTML = `
                <div class="card-image">
                    <img
                        src="${bild}"
                        alt="${titel}"
                        loading="lazy"
                        onerror="this.src='${PLACEHOLDER}'; this.onerror=null;"
                    >
                </div>
                <div class="card-body">
                    ${datum ? `<div class="card-datum">${datum}</div>` : ''}
                    <div class="card-titel">${titel}</div>
                    ${desc ? `<div class="card-beschreibung">${desc}</div>` : ''}
                    ${link ? `<a class="card-link" href="${link}" target="_blank" rel="noopener">${linkText} &rarr;</a>` : ''}
                </div>
            `;
            grid.appendChild(card);
        });

        sendHeight();
    }

    function sendHeight() {
        window.parent.postMessage(
            { type: 'ankuendigungen-resize', height: document.body.scrollHeight },
            '*'
        );
    }

    window.addEventListener('load', sendHeight);
    const resizeObserver = new ResizeObserver(sendHeight);
    resizeObserver.observe(document.body);

    loadAnnouncements();
})();
</script>
</body>
</html>
