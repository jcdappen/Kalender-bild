<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gottesdienst Ansagen - 16:9</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: white;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── Slides ── */
        .slide {
            width: 100vw;
            height: 100vh;
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .slide.active {
            display: flex;
            opacity: 1;
        }

        /* ── Titel-Slide ── */
        .title-slide {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5vh 5vw;
            background: rgba(0,0,0,0.35);
        }

        .title-slide h1 {
            font-size: clamp(40px, 8vw, 120px);
            font-weight: 900;
            margin-bottom: 2vh;
            text-shadow: 4px 4px 12px rgba(0,0,0,0.9);
            color: #bb2232;
        }

        .title-slide .subtitle {
            font-size: clamp(22px, 3.5vw, 58px);
            font-weight: 600;
            margin-bottom: 3vh;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.45);
            padding: 10px 28px;
            border-radius: 999px;
            display: inline-block;
        }

        .title-slide .church-name {
            font-size: clamp(18px, 2.8vw, 46px);
            opacity: 0.8;
            margin-top: 2vh;
            padding-top: 2vh;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            border-top: 2px solid rgba(255,255,255,0.25);
        }

        /* ── Event-Slide ── */
        .event-slide {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4vh 5vw;
        }

        /* Äußere Karte */
        .event-card {
            width: 100%;
            max-width: min(92vw, 1500px);
            height: 72vh;
            display: flex;
            border-radius: 20px 20px 20px 6px;
            overflow: hidden;
            box-shadow:
                0 4px 20px rgba(0,0,0,0.4),
                0 20px 60px rgba(0,0,0,0.6);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* ── Linke Spalte: Datum in Rot ── */
        .event-left {
            background: #bb2232;
            width: 30%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: clamp(20px, 3vw, 50px);
            position: relative;
            gap: clamp(6px, 1.2vh, 16px);
        }

        /* Goldener Akzentstreifen oben */
        .event-left::before { content: ''; display: none; }

        /* Dezenter Muster-Overlay in linker Spalte */
        .event-left::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 24px,
                rgba(0,0,0,0.04) 24px,
                rgba(0,0,0,0.04) 48px
            );
            pointer-events: none;
        }

        .event-day-number {
            font-size: clamp(64px, 10vw, 160px);
            font-weight: 900;
            color: #fff;
            line-height: 1;
            letter-spacing: -0.04em;
            position: relative;
            z-index: 1;
        }

        .event-left-divider {
            width: 36px;
            height: 3px;
            background: #edc544;
            border-radius: 999px;
            position: relative;
            z-index: 1;
        }

        .event-day-name {
            font-size: clamp(14px, 1.8vw, 28px);
            font-weight: 700;
            color: rgba(255,255,255,0.88);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            z-index: 1;
        }

        .event-month-year {
            font-size: clamp(12px, 1.3vw, 22px);
            color: rgba(255,255,255,0.6);
            font-weight: 400;
            position: relative;
            z-index: 1;
        }

        /* ── Rechte Spalte: Glassmorphism dunkel ── */
        .event-right {
            flex: 1;
            background: rgba(15, 15, 25, 0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-left: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: clamp(24px, 4vw, 70px);
            gap: clamp(10px, 1.8vh, 24px);
            position: relative;
        }

        /* Goldener Akzentstreifen oben */
        .event-right::before { content: ''; display: none; }

        .event-title {
            font-size: clamp(28px, 4.5vw, 82px);
            font-weight: 900;
            line-height: 1.1;
            color: #fff;
            letter-spacing: -0.02em;
            word-wrap: break-word;
            hyphens: auto;
            text-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }

        .event-title.long-title        { font-size: clamp(24px, 3.8vw, 66px); }
        .event-title.very-long-title   { font-size: clamp(20px, 3.2vw, 54px); line-height: 1.2; }
        .event-title.extremely-long-title { font-size: clamp(17px, 2.6vw, 44px); line-height: 1.3; }

        /* Beschreibung — mit goldener Akzentlinie */
        .event-description {
            font-size: clamp(13px, 1.6vw, 28px);
            color: rgba(255,255,255,0.65);
            font-style: italic;
            line-height: 1.55;
            border-left: 3px solid rgba(237, 197, 68, 0.5);
            padding-left: clamp(10px, 1.2vw, 20px);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Trennlinie vor Badges */
        .event-divider {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.10);
        }

        /* Pill-Badges */
        .event-badges {
            display: flex;
            flex-wrap: wrap;
            gap: clamp(8px, 1vw, 16px);
        }

        .event-badge {
            display: inline-flex;
            align-items: center;
            gap: clamp(6px, 0.7vw, 12px);
            padding: clamp(6px, 0.9vh, 12px) clamp(14px, 1.6vw, 26px);
            border-radius: 999px;
            font-size: clamp(13px, 1.7vw, 28px);
            font-weight: 600;
        }

        .event-badge-time {
            background: rgba(237, 197, 68, 0.12);
            border: 1.5px solid rgba(237, 197, 68, 0.45);
            color: #edc544;
        }

        .event-badge-location {
            background: rgba(171, 208, 117, 0.10);
            border: 1.5px solid rgba(171, 208, 117, 0.4);
            color: #abd075;
        }

        .event-badge svg {
            flex-shrink: 0;
            width: clamp(15px, 1.7vw, 26px);
            height: clamp(15px, 1.7vw, 26px);
        }

        /* QR-Code dezent unten rechts */
        .event-qr {
            position: absolute;
            bottom: clamp(14px, 2vh, 28px);
            right: clamp(14px, 2vw, 36px);
            opacity: 0.35;
        }

        .event-qr img {
            width: clamp(48px, 6vw, 90px);
            height: clamp(48px, 6vw, 90px);
            object-fit: contain;
        }

        /* ── Info-Slide ── */
        .info-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3vh 3vw;
        }

        .info-slide img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 24px 24px 24px 8px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
        }

        /* ── Seitenzahl ── */
        .slide-footer {
            position: absolute;
            bottom: clamp(10px, 1.8vh, 20px);
            right: clamp(18px, 2.5vw, 36px);
            font-size: clamp(12px, 1.1vw, 20px);
            color: #fff;
            background: rgba(0,0,0,0.4);
            padding: 4px 14px;
            border-radius: 999px;
            opacity: 0.45;
        }

        /* ── Ladebildschirm ── */
        .loading-slide {
            justify-content: center;
            align-items: center;
        }

        .loading-text {
            font-size: clamp(28px, 4vw, 72px);
            color: #bb2232;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        /* ── Progress Bar ── */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: clamp(4px, 0.5vh, 8px);
            background: #bb2232;
            transition: width linear;
            box-shadow: 0 0 16px rgba(187,34,50,0.55);
            z-index: 1000;
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .event-card {
                flex-direction: column;
                height: auto;
                max-height: 85vh;
            }
            .event-left {
                width: 100%;
                flex-direction: row;
                justify-content: center;
                padding: 16px 24px;
                gap: 14px;
            }
            .event-left::before { height: 4px; }
            .event-day-number { font-size: clamp(36px, 10vw, 56px); }
            .event-left-divider { width: 3px; height: 32px; }
        }

        @media (min-width: 2560px) {
            .event-card { max-width: 2200px; }
        }
    </style>
</head>
<body>
    <div id="slides-container">
        <div class="slide loading-slide active">
            <div class="loading-text">Lade Termine...</div>
        </div>
    </div>

    <div class="progress-bar" id="progress-bar"></div>

    <script>
        let currentSlideIndex = 0;
        let slideElements = [];
        let rotationInterval;

        const EVENT_SLIDE_TIME = 10000;
        const INFO_SLIDE_TIME  = 6000;
        const TITLE_SLIDE_TIME = 5000;

        async function loadEvents() {
            const res = await fetch('data/termine.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('termine.json konnte nicht geladen werden');
            const all = await res.json();

            const now = new Date();
            const twoWeeksFromNow = new Date();
            twoWeeksFromNow.setDate(now.getDate() + 14);

            return all.filter(ev => {
                const start = new Date(ev.startDate);
                return start >= now && start <= twoWeeksFromNow;
            });
        }

        async function loadInfoSlides() {
            const candidates = [];
            for (const prefix of ['slide', 'folie', 'info', '']) {
                for (let i = 1; i <= 6; i++) {
                    for (const ext of ['jpg', 'png']) {
                        candidates.push(`slides/${prefix}${i}.${ext}`);
                    }
                }
            }
            const unique = [...new Set(candidates)];
            const found = [];
            for (const path of unique) {
                try {
                    const r = await fetch(path, { method: 'HEAD' });
                    if (r.ok) found.push(path);
                } catch (_) {}
            }
            return found;
        }

        function createTitleSlide() {
            const now = new Date();
            const dateStr = now.toLocaleDateString('de-DE', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
            return `
                <div class="slide title-slide">
                    <h1>Termine &amp; Ank&uuml;ndigungen</h1>
                    <div class="subtitle">${dateStr}</div>
                    <div class="church-name">Gemeinde in der Konkordia</div>
                </div>`;
        }

        function createEventSlide(event, index, total) {
            const startDate = new Date(event.startDate);
            const endDate   = new Date(event.endDate);

            const dayNumber = startDate.getDate();
            const dayName   = startDate.toLocaleDateString('de-DE', { weekday: 'long' });
            const monthYear = startDate.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

            let titleClass = 'event-title';
            const len = event.title.length;
            if      (len > 80) titleClass += ' extremely-long-title';
            else if (len > 60) titleClass += ' very-long-title';
            else if (len > 40) titleClass += ' long-title';

            const startTime = startDate.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            const endTime   = endDate.toLocaleTimeString('de-DE',   { hour: '2-digit', minute: '2-digit' });

            let timeHTML = '';
            if (startTime !== '00:00') {
                timeHTML = `
                    <div class="event-badge event-badge-time">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#edc544" stroke-width="2" stroke-linecap="round">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 7v5l3.5 2"/>
                        </svg>
                        ${startTime} – ${endTime} Uhr
                    </div>`;
            }

            let locationHTML = '';
            if (event.location) {
                locationHTML = `
                    <div class="event-badge event-badge-location">
                        <svg viewBox="0 0 24 24" fill="#abd075">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5-2.5z"/>
                        </svg>
                        ${event.location}
                    </div>`;
            }

            let descHTML = '';
            if (event.description) {
                const safe = event.description
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/\n/g, ' ');
                descHTML = `<div class="event-description">${safe}</div>`;
            }

            // Trennlinie nur wenn Beschreibung vorhanden
            const dividerHTML = event.description
                ? `<div class="event-divider"></div>`
                : '';

            return `
                <div class="slide">
                    <div class="event-slide">
                        <div class="event-card">

                            <div class="event-left">
                                <div class="event-day-number">${dayNumber}</div>
                                <div class="event-left-divider"></div>
                                <div class="event-day-name">${dayName}</div>
                                <div class="event-month-year">${monthYear}</div>
                            </div>

                            <div class="event-right">
                                <div class="${titleClass}">${event.title}</div>
                                <div class="event-badges">
                                    ${timeHTML}
                                    ${locationHTML}
                                </div>
                                ${dividerHTML}
                                ${descHTML}
                                <div class="event-qr">
                                    <img src="https://storage2.snappages.site/S74RKH/assets/files/QR_news.png" alt="QR Code">
                                </div>
                            </div>

                        </div>
                    </div>
                    <div class="slide-footer">${index} / ${total}</div>
                </div>`;
        }

        function createInfoSlide(imageUrl, index, total) {
            return `
                <div class="slide info-slide">
                    <img src="${imageUrl}" alt="Info-Folie">
                    <div class="slide-footer">${index} / ${total}</div>
                </div>`;
        }

        function animateProgressBar(duration) {
            const bar = document.getElementById('progress-bar');
            bar.style.transition = 'none';
            bar.style.width = '0%';
            setTimeout(() => {
                bar.style.transition = `width ${duration}ms linear`;
                bar.style.width = '100%';
            }, 100);
        }

        function showSlide(index) {
            slideElements.forEach((el, i) => {
                if (i === index) el.classList.add('active');
                else             el.classList.remove('active');
            });

            const current = slideElements[index];
            let duration = EVENT_SLIDE_TIME;
            if (current.classList.contains('title-slide')) duration = TITLE_SLIDE_TIME;
            if (current.classList.contains('info-slide'))  duration = INFO_SLIDE_TIME;

            animateProgressBar(duration);

            clearInterval(rotationInterval);
            rotationInterval = setInterval(() => {
                currentSlideIndex = (currentSlideIndex + 1) % slideElements.length;
                showSlide(currentSlideIndex);
            }, duration);
        }

        async function initPresentation() {
            try {
                const [events, infoSlides] = await Promise.all([loadEvents(), loadInfoSlides()]);

                const totalSlides = 1 + events.length + infoSlides.length;
                let html = createTitleSlide();
                let slideNum = 2;
                let eIdx = 0;
                let iIdx = 0;

                while (eIdx < events.length || iIdx < infoSlides.length) {
                    for (let i = 0; i < 3 && eIdx < events.length; i++) {
                        html += createEventSlide(events[eIdx], slideNum, totalSlides);
                        slideNum++;
                        eIdx++;
                    }
                    if (iIdx < infoSlides.length) {
                        html += createInfoSlide(infoSlides[iIdx], slideNum, totalSlides);
                        slideNum++;
                        iIdx++;
                    }
                }

                const container = document.getElementById('slides-container');
                container.innerHTML = html;
                slideElements = Array.from(container.querySelectorAll('.slide'));

                if (slideElements.length > 0) {
                    currentSlideIndex = 0;
                    showSlide(0);
                } else {
                    container.innerHTML = `
                        <div class="slide title-slide active">
                            <h1>Keine Termine</h1>
                            <div class="subtitle">In den n&auml;chsten 14 Tagen sind keine Termine verf&uuml;gbar</div>
                        </div>`;
                }

            } catch (err) {
                console.error('Fehler:', err);
                document.getElementById('slides-container').innerHTML = `
                    <div class="slide title-slide active">
                        <h1>Fehler</h1>
                        <div class="subtitle">Termine konnten nicht geladen werden</div>
                    </div>`;
            }
        }

        initPresentation();
        setInterval(initPresentation, 5 * 60 * 1000);
    </script>
</body>
</html>
