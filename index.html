<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konkordia Termine</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --text-color: #1a202c;
            --text-meta: #718096;
            --text-detail: #4a5568;
            --border-color: #e2e8f0;
            --hover-bg: #f7fafc;
            --accent-color: #3182ce;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui,
                         'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: transparent;
            margin: 0;
            padding: 0;
            overflow-wrap: break-word;
            overflow-x: hidden;
            overflow: hidden;
        }

        #ical-widget-container {
            max-width: 860px;
            margin: 0 auto;
        }

        /* ── Monats-Header ── */
        .month-header {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-meta);
            padding: 0 0 12px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 0;
        }

        #calendar-list {
            padding: 0;
        }

        /* ── Termin-Zeile ── */
        .calendar-event {
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: stretch;
        }

        .event-color-bar {
            width: 4px;
            border-radius: 2px;
            flex-shrink: 0;
            margin: 16px 16px 16px 0;
        }

        .event-main {
            flex: 1;
            min-width: 0;
        }

        .event-summary {
            display: block;
            padding: 20px 0;
            cursor: pointer;
            transition: background 0.15s ease;
            border-radius: 4px;
        }

        .event-summary:hover {
            background: var(--hover-bg);
            padding-left: 8px;
            padding-right: 8px;
            margin: 0 -8px;
        }

        .event-summary:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .event-meta {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-meta);
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        .event-title {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-color);
            line-height: 1.35;
        }

        /* ── Aufklapp-Details ── */
        .event-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .calendar-event.active .event-details {
            max-height: 800px;
        }

        .details-inner {
            padding-bottom: 28px;
        }

        /* ── Bild im Detail ── */
        .event-image {
            width: 100%;
            height: 220px;
            overflow: hidden;
            margin-bottom: 20px;
            border-radius: 6px;
        }

        .event-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ── Detail-Zeilen ── */
        .detail-item {
            display: flex;
            align-items: flex-start;
            font-size: 15px;
            margin-bottom: 14px;
            color: var(--text-detail);
            line-height: 1.55;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-item svg {
            width: 18px;
            height: 18px;
            margin-right: 12px;
            fill: var(--text-meta);
            flex-shrink: 0;
            margin-top: 3px;
        }

        /* ── Status ── */
        #calendar-status {
            padding: 32px 0;
            color: var(--text-meta);
            font-size: 16px;
        }

        /* ── Mobile ── */
        @media (max-width: 480px) {
            .event-title  { font-size: 17px; }
            .event-meta   { font-size: 12px; }
            .event-image  { height: 180px; }
            .detail-item  { font-size: 14px; }
        }

        /* Touch: Hover deaktivieren */
        @media (hover: none) and (pointer: coarse) {
            .event-summary:hover {
                background: transparent;
                padding-left: 0;
                padding-right: 0;
                margin: 0;
            }
        }

        html { scroll-behavior: smooth; }
    </style>
</head>
<body>
<div id="ical-widget-container">
    <div id="ical-calendar-widget">
        <div id="calendar-list"></div>
        <div id="calendar-status"></div>
    </div>
</div>

<script>
(function () {
    'use strict';

    const listContainer   = document.getElementById('calendar-list');
    const statusContainer = document.getElementById('calendar-status');
    const PLACEHOLDER     = 'assets/images/placeholder.jpg';

    /* ── Hilfsfunktionen ── */

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function getHeaderText(now) {
        if (now.getDate() >= 28) {
            const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            return now.toLocaleString('de-DE', { month: 'long' }) +
                   ' / ' +
                   nextMonth.toLocaleString('de-DE', { month: 'long', year: 'numeric' });
        }
        return now.toLocaleString('de-DE', { month: 'long', year: 'numeric' });
    }

    function formatMeta(termin, startDate, endDate) {
        const dateStr = startDate.toLocaleString('de-DE', {
            weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
        });
        const isAllDay = !termin.startDate || !termin.startDate.includes('T');
        if (isAllDay) return dateStr;
        const timeOpts = { hour: '2-digit', minute: '2-digit' };
        const from = startDate.toLocaleTimeString('de-DE', timeOpts);
        const to   = endDate.toLocaleTimeString('de-DE', timeOpts);
        return `${dateStr} · ${from} – ${to} Uhr`;
    }

    /* ── Daten laden ── */

    async function loadTermine() {
        statusContainer.textContent = 'Lade Termine …';
        statusContainer.style.display = 'block';

        try {
            const res = await fetch('data/termine.json', { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const all = await res.json();

            const now = new Date();
            const currentDay = now.getDate();

            const monthEnd = currentDay >= 28
                ? new Date(now.getFullYear(), now.getMonth() + 2, 0, 23, 59, 59)
                : new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);

            const termine = all.filter(t => {
                if (!t.startDate) return false;
                const d = new Date(t.startDate);
                return d >= now && d <= monthEnd;
            });

            renderTermine(termine, now);
        } catch (err) {
            console.error('Fehler beim Laden der Termine:', err);
            statusContainer.textContent = 'Termine konnten nicht geladen werden.';
        }
    }

    /* ── Darstellung ── */

    function renderTermine(termine, now) {
        listContainer.innerHTML = '';
        statusContainer.style.display = 'none';

        if (termine.length === 0) {
            statusContainer.textContent = 'Keine anstehenden Termine gefunden.';
            statusContainer.style.display = 'block';
            return;
        }

        // Monats-Header
        const header = document.createElement('div');
        header.className = 'month-header';
        header.textContent = getHeaderText(now);
        listContainer.appendChild(header);

        termine.forEach(termin => {
            const startDate = new Date(termin.startDate);
            const endDate   = new Date(termin.endDate || termin.startDate);
            const title     = escapeHtml(termin.title || 'Termin');
            const image     = escapeHtml(termin.image || PLACEHOLDER);
            const meta      = escapeHtml(formatMeta(termin, startDate, endDate));
            const color     = termin.color || '#718096';

            // Kalender-URLs bauen
            const isAllDay  = !termin.startDate.includes('T');
            function toIcalDate(d, allDay) {
                if (allDay) return d.toISOString().slice(0,10).replace(/-/g,'');
                return d.toISOString().replace(/[-:]/g,'').slice(0,15) + 'Z';
            }
            const icalStart = toIcalDate(startDate, isAllDay);
            const icalEnd   = toIcalDate(isAllDay ? new Date(endDate.getTime() + 86400000) : endDate, isAllDay);
            const gcalUrl   = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
                + '&text=' + encodeURIComponent(termin.title || '')
                + '&dates=' + icalStart + '/' + icalEnd
                + (termin.description ? '&details=' + encodeURIComponent(termin.description) : '')
                + (termin.location    ? '&location=' + encodeURIComponent(termin.location)   : '');
            const icsContent = [
                'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Konkordia//DE',
                'BEGIN:VEVENT',
                'DTSTART' + (isAllDay ? ';VALUE=DATE' : '') + ':' + icalStart,
                'DTEND'   + (isAllDay ? ';VALUE=DATE' : '') + ':' + icalEnd,
                'SUMMARY:' + (termin.title || '').replace(/,/g, '\\,'),
                termin.description ? 'DESCRIPTION:' + termin.description.replace(/\n/g,'\\n').replace(/,/g,'\\,') : '',
                termin.location    ? 'LOCATION:'    + termin.location.replace(/,/g,'\\,')    : '',
                'END:VEVENT','END:VCALENDAR'
            ].filter(Boolean).join('\r\n');
            const icsUrl = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(icsContent);

            // Detail-Inhalt
            let detailsHTML = `<div class="details-inner">`;

            // Bild – src wird erst beim Öffnen gesetzt (data-src für lazy)
            detailsHTML += `
                <div class="event-image">
                    <img data-src="${image}" alt="${title}" onerror="this.src='${PLACEHOLDER}'; this.onerror=null;">
                </div>`;

            if (termin.location) {
                const mapsUrl = 'https://maps.google.com/?q=' + encodeURIComponent(termin.location);
                detailsHTML += `
                    <div class="detail-item">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75
                                     7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5
                                     2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                        </svg>
                        <div><a href="${mapsUrl}" target="_blank" rel="noopener" style="color:var(--accent-color);text-decoration:none;font-weight:500;">${escapeHtml(termin.location)}</a></div>
                    </div>`;
            }

            if (termin.description) {
                detailsHTML += `
                    <div class="detail-item">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M14 17H4v2h10v-2zm6-8H4v2h16V9zM4 15h16v-2H4v2zM4 5v2h16V5H4z"/>
                        </svg>
                        <div>${escapeHtml(termin.description).replace(/\n/g, '<br>')}</div>
                    </div>`;
            }

            if (termin.link) {
                detailsHTML += `
                    <div class="detail-item">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24
                                     5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71
                                     0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
                        </svg>
                        <div><a href="${escapeHtml(termin.link)}" target="_blank" rel="noopener" style="color:var(--accent-color);text-decoration:none;font-weight:500;">${escapeHtml(termin.link)}</a></div>
                    </div>`;
            }

            // Kalender-Buttons
            detailsHTML += `
                    <div class="detail-item" style="gap:10px;flex-wrap:wrap;align-items:center;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="flex-shrink:0;">
                            <path d="M19 3h-1V1h-2v2H8V1H6v2H5C3.89 3 3 3.9 3 5v14c0 1.1.89 2 2 2h14c1.1 0
                                     2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
                        </svg>
                        <a href="${gcalUrl}" target="_blank" rel="noopener"
                           style="color:var(--accent-color);text-decoration:none;font-weight:500;font-size:14px;">
                            Google Calendar
                        </a>
                        <a href="${icsUrl}" download="${encodeURIComponent(termin.title || 'termin')}.ics"
                           style="color:var(--accent-color);text-decoration:none;font-weight:500;font-size:14px;">
                            Apple / iCal
                        </a>
                    </div>`;

            detailsHTML += `</div>`;

            const wrapper = document.createElement('div');
            wrapper.className = 'calendar-event';
            wrapper.innerHTML = `
                <div class="event-color-bar" style="background:${color};"></div>
                <div class="event-main">
                    <div class="event-summary" tabindex="0" role="button" aria-expanded="false">
                        <div class="event-meta">${meta}</div>
                        <div class="event-title">${title}</div>
                    </div>
                    <div class="event-details">${detailsHTML}</div>
                </div>
            `;

            listContainer.appendChild(wrapper);
        });

        addEventListeners();
    }

    /* ── Interaktivität ── */

    function addEventListeners() {
        listContainer.querySelectorAll('.event-summary').forEach(summary => {
            const toggleEvent = () => {
                const eventWrapper = summary.closest('.calendar-event');

                // Andere schließen
                listContainer.querySelectorAll('.calendar-event.active').forEach(active => {
                    if (active !== eventWrapper) {
                        active.classList.remove('active');
                        active.querySelector('.event-summary').setAttribute('aria-expanded', 'false');
                    }
                });

                const isActive = eventWrapper.classList.toggle('active');
                summary.setAttribute('aria-expanded', String(isActive));

                // Bild lazy laden beim ersten Öffnen
                if (isActive) {
                    eventWrapper.querySelectorAll('img[data-src]').forEach(img => {
                        img.src = img.dataset.src;
                        img.removeAttribute('data-src');
                    });
                }
            };

            summary.addEventListener('click', toggleEvent);
            summary.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleEvent();
                }
            });
        });
    }

    loadTermine();
})();
</script>
<script>
  function sendHeight() {
    const container = document.getElementById('ical-widget-container');
    const height = Math.ceil(container.getBoundingClientRect().height);
    window.parent.postMessage({ type: 'kalender-resize', height: height }, '*');
  }
  window.addEventListener('load', sendHeight);
  const resizeObserver = new ResizeObserver(sendHeight);
  resizeObserver.observe(document.getElementById('ical-widget-container'));
  // Nach Accordion-Transition nochmals messen (400 ms)
  document.addEventListener('transitionend', function(e) {
    if (e.propertyName === 'max-height') sendHeight();
  });
</script>
</body>
</html>
