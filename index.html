<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konkordia Termine</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --primary-bg: transparent;
            --widget-bg: transparent;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #2d3748;
            --text-light: #4a5568;
            --accent-color: #3182ce;
            --border-color: rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 8px 25px 0 rgba(0, 0, 0, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui,
                         'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--primary-bg);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-wrap: break-word;
            overflow-x: hidden;
        }

        #ical-widget-container {
            max-width: 860px;
            margin: 0 auto;
            background: var(--widget-bg);
            border: none;
            box-shadow: none;
            overflow: hidden;
        }

        #ical-calendar-widget {
            padding: 0;
        }

        .month-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-color);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: 0.5px;
        }

        #calendar-list {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── Karte ── */
        .calendar-event {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .calendar-event:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }

        /* ── Bild oben ── */
        .event-image {
            width: 100%;
            height: 200px;
            overflow: hidden;
            border-bottom: 1px solid var(--border-color);
        }

        .event-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .calendar-event:hover .event-image img {
            transform: scale(1.03);
        }

        /* ── Datum + Titel-Zeile ── */
        .event-summary {
            display: flex;
            align-items: stretch;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 80px;
            padding: 0;
        }

        .event-summary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .event-summary:active {
            transform: scale(0.98);
        }

        .event-date {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text-color);
            text-align: center;
            width: 90px;
            min-width: 90px;
            padding: 16px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border-color);
        }

        .date-weekday {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 2px;
        }

        .date-day {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1;
        }

        .date-month {
            font-size: 14px;
            font-weight: 400;
            margin-top: 2px;
            opacity: 0.8;
        }

        .event-info {
            flex-grow: 1;
            padding: 24px 28px;
            display: flex;
            align-items: center;
            border-left-width: 4px;
            border-left-style: solid;
        }

        .event-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            line-height: 1.4;
        }

        /* ── Aufklapp-Details ── */
        .event-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        padding 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0 32px;
            background: rgba(255, 255, 255, 0.05);
        }

        .calendar-event.active .event-details {
            max-height: 600px;
            padding: 28px 32px 32px 32px;
        }

        .detail-item {
            display: flex;
            align-items: flex-start;
            font-size: 16px;
            margin-bottom: 20px;
            color: var(--text-light);
            line-height: 1.5;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        .detail-item svg {
            width: 22px;
            height: 22px;
            margin-right: 18px;
            fill: var(--accent-color);
            flex-shrink: 0;
            margin-top: 2px;
            opacity: 0.8;
        }

        .detail-link a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            background: var(--accent-color);
            color: white;
            padding: 14px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px 0 rgba(49, 130, 206, 0.3);
        }

        .detail-link a:hover {
            background: #2c5aa0;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px 0 rgba(49, 130, 206, 0.4);
        }

        #calendar-status {
            padding: 40px 24px;
            text-align: center;
            color: var(--text-light);
            font-size: 18px;
            line-height: 1.6;
        }

        /* ── Mobile ── */
        @media (max-width: 768px) {
            .month-header { padding: 12px 16px; font-size: 16px; }
            #calendar-list { padding: 12px; gap: 12px; }
            .event-image { height: 180px; }
            .event-summary { min-height: 70px; }
            .event-date { width: 70px; min-width: 70px; padding: 14px 12px; }
            .date-day { font-size: 28px; }
            .date-month { font-size: 12px; }
            .event-info { padding: 20px; }
            .event-title { font-size: 16px; }
            .event-details { padding: 0 20px; }
            .calendar-event.active .event-details { padding: 24px 20px 28px 20px; }
            .detail-item { font-size: 15px; margin-bottom: 16px; }
            .detail-item svg { width: 20px; height: 20px; margin-right: 16px; }
            .detail-link a { padding: 12px 20px; font-size: 15px; }
            #calendar-status { padding: 30px 16px; font-size: 16px; }
        }

        @media (max-width: 480px) {
            .month-header { padding: 10px 12px; font-size: 15px; }
            #calendar-list { padding: 8px; gap: 10px; }
            .event-image { height: 160px; }
            .event-summary { min-height: 60px; }
            .event-date { width: 60px; min-width: 60px; padding: 10px 8px; }
            .date-weekday { font-size: 9px; }
            .date-day { font-size: 24px; }
            .date-month { font-size: 11px; }
            .event-info { padding: 16px; }
            .event-title { font-size: 14px; }
            .event-details { padding: 0 16px; }
            .calendar-event.active .event-details { padding: 20px 16px 24px 16px; }
            .detail-item { font-size: 14px; margin-bottom: 14px; }
            .detail-link a { padding: 10px 18px; font-size: 14px; }
        }

        /* Touch-Geräte: Hover-Effekte deaktivieren */
        @media (hover: none) and (pointer: coarse) {
            .event-summary:hover { background: transparent; }
            .calendar-event:hover { transform: none; box-shadow: var(--shadow); }
            .calendar-event:hover .event-image img { transform: none; }
            .detail-link a:hover {
                transform: none;
                background: var(--accent-color);
                box-shadow: 0 2px 8px 0 rgba(49, 130, 206, 0.3);
            }
        }

        .event-summary { min-height: 44px; }
        html { scroll-behavior: smooth; }

        .event-summary:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }
        .detail-link a:focus {
            outline: 2px solid rgba(255, 255, 255, 0.8);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
<div id="ical-widget-container">
    <div id="ical-calendar-widget">
        <div id="calendar-list"></div>
        <div id="calendar-status"></div>
    </div>
</div>

<script>
(function () {
    'use strict';

    const listContainer   = document.getElementById('calendar-list');
    const statusContainer = document.getElementById('calendar-status');
    const PLACEHOLDER     = 'assets/images/placeholder.jpg';

    /* ── Hilfsfunktionen ── */

    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function getHeaderText(now) {
        if (now.getDate() >= 28) {
            const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
            return now.toLocaleString('de-DE', { month: 'long' }) +
                   ' / ' +
                   nextMonth.toLocaleString('de-DE', { month: 'long', year: 'numeric' });
        }
        return now.toLocaleString('de-DE', { month: 'long', year: 'numeric' });
    }

    /* ── Daten laden ── */

    async function loadTermine() {
        statusContainer.textContent = 'Lade Termine …';
        statusContainer.style.display = 'block';

        try {
            const res = await fetch('data/termine.json', { cache: 'no-store' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const all = await res.json();

            const now = new Date();
            const currentDay = now.getDate();

            // Ab dem 28.: auch nächsten Monat anzeigen
            const monthEnd = currentDay >= 28
                ? new Date(now.getFullYear(), now.getMonth() + 2, 0, 23, 59, 59)
                : new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);

            const termine = all.filter(t => {
                if (!t.startDate) return false;
                const d = new Date(t.startDate);
                return d >= now && d <= monthEnd;
            });

            renderTermine(termine, now);
        } catch (err) {
            console.error('Fehler beim Laden der Termine:', err);
            statusContainer.textContent = 'Termine konnten nicht geladen werden.';
        }
    }

    /* ── Darstellung ── */

    function renderTermine(termine, now) {
        listContainer.innerHTML = '';
        statusContainer.style.display = 'none';

        if (termine.length === 0) {
            statusContainer.textContent = 'Keine anstehenden Termine gefunden.';
            statusContainer.style.display = 'block';
            return;
        }

        // Monats-Header
        const header = document.createElement('div');
        header.className = 'month-header';
        header.textContent = getHeaderText(now);
        listContainer.appendChild(header);

        termine.forEach((termin, index) => {
            const showImage = index < 10;
            const startDate = new Date(termin.startDate);
            const endDate   = new Date(termin.endDate || termin.startDate);

            const day        = String(startDate.getDate()).padStart(2, '0');
            const weekday    = startDate.toLocaleString('de-DE', { weekday: 'short' }).toUpperCase();
            const monthShort = startDate.toLocaleString('de-DE', { month: 'short' }).toUpperCase();
            const color      = termin.color || '#27ae60';
            const image      = escapeHtml(termin.image || PLACEHOLDER);
            const title      = escapeHtml(termin.title || 'Termin');

            // Ist es ein Ganztages-Termin? (kein Zeitanteil im startDate)
            const isAllDay = !termin.startDate || !termin.startDate.includes('T');
            const timeOpts = { hour: '2-digit', minute: '2-digit' };

            let detailsHTML = '';

            if (!isAllDay) {
                detailsHTML += `
                    <div class="detail-item">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                        </svg>
                        <div>${startDate.toLocaleTimeString('de-DE', timeOpts)} &ndash; ${endDate.toLocaleTimeString('de-DE', timeOpts)} Uhr</div>
                    </div>`;
            }

            if (termin.location) {
                detailsHTML += `
                    <div class="detail-item">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75
                                     7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5
                                     2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                        </svg>
                        <div>${escapeHtml(termin.location)}</div>
                    </div>`;
            }

            if (termin.description) {
                detailsHTML += `
                    <div class="detail-item">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0
                                     2-.9 2-2V6c0-1.1-.9-2-2-2zM4 6h16v2H4V6zm16 12H4V10h16v8z"/>
                        </svg>
                        <div>${escapeHtml(termin.description).replace(/\n/g, '<br>')}</div>
                    </div>`;
            }


            const wrapper = document.createElement('div');
            wrapper.className = 'calendar-event';
            wrapper.innerHTML = `
                ${showImage ? `<div class="event-image">
                    <img
                        src="${image}"
                        alt="${title}"
                        loading="lazy"
                        onerror="this.src='${PLACEHOLDER}'; this.onerror=null;"
                    >
                </div>` : ''}
                <div class="event-summary" tabindex="0" role="button" aria-expanded="false">
                    <div class="event-date">
                        <div class="date-weekday">${weekday}</div>
                        <div class="date-day">${day}</div>
                        <div class="date-month">${monthShort}</div>
                    </div>
                    <div class="event-info" style="border-left-color: ${color};">
                        <span class="event-title">${title}</span>
                    </div>
                </div>
                <div class="event-details">${detailsHTML}</div>
            `;

            listContainer.appendChild(wrapper);
        });

        addEventListeners();
    }

    /* ── Interaktivität ── */

    function addEventListeners() {
        listContainer.querySelectorAll('.event-summary').forEach(summary => {
            const toggleEvent = () => {
                const eventWrapper = summary.closest('.calendar-event');
                listContainer.querySelectorAll('.calendar-event.active').forEach(active => {
                    if (active !== eventWrapper) {
                        active.classList.remove('active');
                        active.querySelector('.event-summary').setAttribute('aria-expanded', 'false');
                    }
                });
                const isActive = eventWrapper.classList.toggle('active');
                summary.setAttribute('aria-expanded', String(isActive));
            };

            summary.addEventListener('click', toggleEvent);
            summary.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleEvent();
                }
            });
        });
    }

    loadTermine();
})();
</script>
</body>
</html>
